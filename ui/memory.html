<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>What this memory is doing</title>
  <style>
    :root { color-scheme: light dark; font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; --surface: light-dark(#fffefb,#252624); --ink: light-dark(#292a26,#f1f1ea); --muted: light-dark(#71736b,#b8bbb0); --line: light-dark(#e8e8de,#45483e); --tint: light-dark(#f3f1e8,#33372c); --accent: light-dark(#635284,#d5c3f2); --warning: light-dark(#9a4c27,#f7bb96); }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; padding: 14px; color: var(--ink); background: transparent; }
    button { font: inherit; border: 0; cursor: pointer; }
    button:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
    summary { cursor: pointer; }
    #ledger { max-width: 680px; margin: auto; }
    .control { display: flex; justify-content: center; }
    #toggle { display: inline-flex; align-items: center; gap: 14px; color: #fff; background: #252624; padding: 12px 17px; border-radius: 32px; box-shadow: 0 7px 20px #00000020; text-align: left; min-height: 57px; max-width: 100%; }
    #toggle:hover { background: #383a34; }
    .signal { display: flex; align-items: center; gap: 3px; height: 23px; flex-shrink: 0; }
    .signal i { width: 3px; height: 9px; border-radius: 3px; background: #d7c4f3; }
    .signal i:nth-child(2), .signal i:nth-child(4) { height: 16px; }
    .signal i:nth-child(3) { height: 23px; }
    [data-busy="true"] .signal i { animation: pulse .8s ease-in-out infinite alternate; }
    [data-busy="true"] .signal i:nth-child(2n) { animation-delay: .3s; }
    @keyframes pulse { to { transform: scaleY(.35); } }
    #title { display: block; font-size: 13px; font-weight: 500; }
    #subtitle { display: block; font-size: 11px; color: #c9cdbf; overflow-wrap: anywhere; }
    .chevron { width: 7px; height: 7px; border-right: 1.5px solid #bfc3b6; border-bottom: 1.5px solid #bfc3b6; transform: rotate(45deg); transition: transform .18s; margin: 0 3px 4px 2px; flex-shrink: 0; }
    [aria-expanded="true"] .chevron { transform: rotate(225deg); margin-top: 5px; }
    #panel { margin-top: 15px; border: 1px solid var(--line); border-radius: 18px; background: var(--surface); box-shadow: 0 8px 28px #0000000d; padding: 21px; }
    .panel-heading { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    h1 { font-size: 17px; margin: 0; font-weight: 600; }
    h2 { font-size: 13px; margin: 0 0 4px; font-weight: 600; }
    p { margin: 7px 0; overflow-wrap: anywhere; }
    .secondary, .meta { color: var(--muted); font-size: 12px; }
    .close { background: transparent; color: var(--muted); padding: 5px 9px; border-radius: 8px; font-size: 20px; }
    .close:hover { background: var(--tint); }
    #headline { list-style: none; margin: 15px 0 0; padding: 0; }
    #headline li { display: flex; gap: 10px; align-items: baseline; border-top: 1px solid var(--line); padding: 9px 0; font-size: 13px; overflow-wrap: anywhere; }
    #headline .figure { font-size: 17px; font-weight: 600; color: var(--accent); min-width: 44px; flex-shrink: 0; }
    .section { border-top: 1px solid var(--line); padding: 15px 0 0; margin-top: 15px; }
    .row { background: var(--tint); border-radius: 11px; padding: 12px 14px; margin-top: 10px; }
    .peers { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 9px; }
    /* Competing accepted claims are laid out as equal columns on purpose: no order, no emphasis,
       no first position that reads as a winner. */
    .peer { flex: 1 1 210px; min-width: 0; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); padding: 11px 12px; }
    .peer .claim { font-size: 13px; overflow-wrap: anywhere; }
    .peer .meta { display: block; margin-top: 5px; }
    .mono { font: 11px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; overflow-wrap: anywhere; }
    .notice { color: var(--warning); }
    ul.plain { list-style: none; margin: 8px 0 0; padding: 0; }
    ul.plain li { font-size: 12px; color: var(--muted); padding: 3px 0; overflow-wrap: anywhere; }
    .empty { font-size: 12px; color: var(--muted); margin: 8px 0 0; }
    @media (max-width: 400px) { body { padding: 8px; } #panel { padding: 16px; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
    @media (pointer: coarse) { button, summary { min-height: 44px; } }
  </style>
</head>
<body>
  <main id="ledger" aria-label="Ledger memory card" data-busy="true">
    <div class="control"><button id="toggle" type="button" aria-expanded="false" aria-controls="panel"><span class="signal" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span><span><span id="title">Reading the ledger</span><span id="subtitle" role="status" aria-live="polite">Working out what this memory is doing</span></span><span class="chevron" aria-hidden="true"></span></button></div>
    <section id="panel" hidden aria-label="What this memory is doing">
      <div class="panel-heading"><h1 id="panel-title">What this memory is doing</h1><button id="close" type="button" class="close" aria-label="Collapse report">×</button></div>
      <p id="notice" class="secondary"></p>
      <ul id="headline"></ul>
      <div id="sections"></div>
    </section>
  </main>
  <!-- APP_SCRIPT -->
</body>
</html>
