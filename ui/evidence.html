<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ledger evidence</title>
  <style>
    :root { color-scheme: light dark; font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; --surface: light-dark(#fffefb,#252624); --ink: light-dark(#292a26,#f1f1ea); --muted: light-dark(#71736b,#b8bbb0); --line: light-dark(#e8e8de,#45483e); --tint: light-dark(#f3f1e8,#33372c); --accent: light-dark(#635284,#d5c3f2); --warning: light-dark(#9a4c27,#f7bb96); }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; padding: 14px; color: var(--ink); background: transparent; }
    button, input, textarea { font: inherit; }
    button, summary { cursor: pointer; }
    button:focus-visible, summary:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
    button { border: 0; }
    #ledger { max-width: 680px; margin: auto; }
    .control { display: flex; justify-content: center; }
    #toggle { display: inline-flex; align-items: center; gap: 14px; color: #fff; background: #252624; padding: 12px 17px; border-radius: 32px; box-shadow: 0 7px 20px #00000020; text-align: left; min-height: 57px; max-width: 100%; }
    #toggle:hover { background: #383a34; }
    .signal { display: flex; align-items: center; gap: 3px; height: 23px; flex-shrink: 0; }
    .signal i { width: 3px; height: 9px; border-radius: 3px; background: #d7c4f3; }
    .signal i:nth-child(2), .signal i:nth-child(4) { height: 16px; }
    .signal i:nth-child(3) { height: 23px; }
    [data-busy="true"] .signal i { animation: pulse .8s ease-in-out infinite alternate; }
    [data-busy="true"] .signal i:nth-child(2n) { animation-delay: .3s; }
    @keyframes pulse { to { transform: scaleY(.35); } }
    #title { display: block; font-size: 13px; font-weight: 500; }
    #subtitle { display: block; font-size: 11px; color: #c9cdbf; overflow-wrap: anywhere; }
    .chevron { width: 7px; height: 7px; border-right: 1.5px solid #bfc3b6; border-bottom: 1.5px solid #bfc3b6; transform: rotate(45deg); transition: transform .18s; margin: 0 3px 4px 2px; flex-shrink: 0; }
    [aria-expanded="true"] .chevron { transform: rotate(225deg); margin-top: 5px; }
    #panel { margin-top: 15px; border: 1px solid var(--line); border-radius: 18px; background: var(--surface); box-shadow: 0 8px 28px #0000000d; padding: 21px; }
    .panel-heading { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    h1 { font-size: 17px; margin: 0; font-weight: 600; }
    p { margin: 7px 0; overflow-wrap: anywhere; }
    .secondary, .meta { color: var(--muted); font-size: 12px; }
    .close { background: transparent; color: var(--muted); padding: 5px 9px; border-radius: 8px; font-size: 20px; }
    .close:hover { background: var(--tint); }
    #people { display: flex; gap: 7px; flex-wrap: wrap; margin: 17px 0 8px; }
    #people button { color: var(--muted); background: var(--tint); border-radius: 20px; padding: 6px 12px; font-size: 12px; }
    #people [aria-pressed="true"] { background: var(--ink); color: var(--surface); }
    #sources { margin-top: 12px; }
    .source { border-top: 1px solid var(--line); padding: 15px 0; }
    .source:last-child { padding-bottom: 0; }
    .source > summary { list-style: none; display: flex; align-items: start; gap: 11px; }
    .source > summary::-webkit-details-marker { display: none; }
    .avatar { display: inline-grid; place-items: center; background: var(--tint); color: var(--accent); width: 31px; height: 31px; border-radius: 50%; flex-shrink: 0; font-size: 12px; font-weight: 600; }
    .source-label { flex: 1; min-width: 0; }
    .source-title { display: block; font-weight: 500; font-size: 13px; overflow-wrap: anywhere; }
    .source > summary::after { content: '+'; color: var(--muted); font-size: 18px; }
    .source[open] > summary::after { content: '−'; }
    .source-content { margin: 15px 0 0 42px; }
    .source-content > p { font-size: 13px; }
    .notice { color: var(--warning); }
    .use { background: var(--tint); border-radius: 11px; padding: 12px 14px; margin-top: 14px; }
    blockquote { margin: 6px 0; overflow-wrap: anywhere; font-size: 14px; }
    .record { margin-top: 14px; font-size: 12px; color: var(--muted); }
    pre { font: 11px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap; overflow-wrap: anywhere; margin: 12px 0 0; color: var(--ink); }
    .action { display: inline-flex; margin-top: 14px; border: 1px solid var(--line); padding: 8px 12px; border-radius: 9px; color: var(--ink); background: var(--surface); font-size: 12px; }
    .action:hover { background: var(--tint); }
    .primary { background: var(--ink); color: var(--surface); }
    .primary:hover { opacity: .8; background: var(--ink); }
    .attribution { margin-top: 15px; padding-top: 8px; }
    label { display: block; margin: 11px 0; font-size: 12px; }
    textarea { display: block; width: 100%; margin-top: 5px; border: 1px solid var(--line); border-radius: 9px; padding: 10px; background: var(--surface); color: var(--ink); resize: vertical; font-size: 13px; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; }
    #notice { margin-bottom: 0; }
    @media (max-width: 400px) { body { padding: 8px; } #panel { padding: 16px; } .source-content { margin-left: 0; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
    @media (pointer: coarse) { button, summary { min-height: 44px; } textarea { font-size: 16px; } }
  </style>
</head>
<body>
  <main id="ledger" aria-label="Ledger evidence card" data-busy="true">
    <div class="control"><button id="toggle" type="button" aria-expanded="false" aria-controls="panel"><span class="signal" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span><span><span id="title">Connecting to Ledger</span><span id="subtitle" role="status" aria-live="polite">Bringing your team’s work into view</span></span><span class="chevron" aria-hidden="true"></span></button></div>
    <section id="panel" hidden aria-label="Shared evidence">
      <div class="panel-heading"><h1 id="panel-title">Your team’s context</h1><button id="close" type="button" class="close" aria-label="Collapse evidence">×</button></div>
      <p id="notice" class="secondary"></p>
      <button id="back" type="button" class="action" hidden>← Back to search results</button>
      <div id="people" aria-label="Filter sources by author"></div>
      <div id="sources"></div>
    </section>
  </main>
  <!-- APP_SCRIPT -->
</body>
</html>
